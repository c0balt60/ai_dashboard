# Builds a signed release APK whenever a new app version reaches main and
# publishes it as the GitHub release v<major.minor.patch>, which the phone
# updates from. Build-only bumps (same x.y.z) don't release again.
#
# Needs these repository secrets (see android/key.properties.example):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD only for an old JKS keystore whose key has its own
# password; PKCS12 keystores (keytool's default) use the store password.
# GOOGLE_SERVICES_JSON (the Firebase android/app/google-services.json) is
# optional; without it the APK builds with push notifications turned off.
name: Android release

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and skip it if already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(sed -n 's/^version: *//p' pubspec.yaml)
          name=${full%%+*}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=${full##*+}" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$name is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get packages
        run: |
          flutter pub get
          (cd packages/agent_core && dart pub get)
          (cd server && dart pub get)

      - run: flutter analyze
      - run: flutter test

      # Without the real key Gradle would fall back to a throwaway debug key,
      # and the phone would refuse to install the APK over the existing app.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_* signing secrets to the repository first."
            exit 1
          fi
          # Tolerate line breaks or spaces picked up when the secret was set.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' \
              | base64 --decode > "$RUNNER_TEMP/upload.jks" 2> /dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 must be the .jks file encoded as base64, not a password. See android/key.properties.example."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-upload}"
          } > android/key.properties

      - name: Set up Firebase for push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK has push notifications turned off."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - run: flutter build apk --release --split-per-abi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.check.outputs.name }}
          BUILD: ${{ needs.check.outputs.build }}
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a; do
            mv "app-$abi-release.apk" "ai_dashboard-$NAME-$abi.apk"
          done
          gh release create "v$NAME" ai_dashboard-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$NAME (build $BUILD)" \
            --generate-notes
